site_name: Projet EntreElève – Introduction aux Etoiles – Enzo CHEN, Raphaël CADIER--GIARD
site_description: Projet de dissémination scientifique
site_authors:
- Enzo CHEN
- Raphaël Cadier--Giard

docs_dir: docs

nav:
  - Informations générales: index.md
  - Déroulé de la Séance: plan.md
  - Simulation Informatique: simulation.md
  - Galerie: galerie_photo.md

theme:
  name: material
  language: fr
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.follow
    - navigation.sections
    - toc.follow
    - toc.integrate
    - navigation.top
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue-grey
      accent: blue-grey

markdown_extensions:
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

copyright: >
  Copyright &copy; 2026 - CS Students –

